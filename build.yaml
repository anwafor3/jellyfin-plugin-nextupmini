framework: "net10.0"
overview: "Shrinks end credits into a corner and counts down to the next episode"
description: >
  When an episode's end credits start, the Jellyfin web player shrinks the credits
  into a corner and shows the next episode with a countdown, Play now and Watch
  credits buttons. Uses credits markers from media segments (for example Intro
  Skipper), chapters named "Credits", or a fixed time before the end. When you pause, it can
  also show the episode or movie, a short summary and its cast.
category: "General"
owner: "anwafor3"
artifacts:
  - "Jellyfin.Plugin.NextUpMini.dll"
changelog: >
  Cast and info when paused: a panel shows the episode or movie, a short summary and its cast;
  picking an actor lists what else they're in from your library. On by default, with a setting
  to turn it off.
