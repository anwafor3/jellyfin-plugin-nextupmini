name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the web script
        run: node --check Jellyfin.Plugin.NextUpMini/Web/next-up-mini.js

      - name: Build
        run: dotnet build Jellyfin.Plugin.NextUpMini/Jellyfin.Plugin.NextUpMini.csproj -c Release
